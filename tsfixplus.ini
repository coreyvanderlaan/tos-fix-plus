; TSFix+ settings. This file goes next to TOS.exe, with d3d9.dll.

[TSFixPlus]
; The most frames per second to show. 0 = as many as the display refreshes (60, 90, 144...).
; A lower number, like 60 or 90, uses less GPU time. The game itself always runs at 30.
MaxFPS=0
; Load TSFix-format texture packs from TSFix_Res\inject in the game folder, if there are any
; (the 4x upscale pack, for example). 0 = off.
TexturePacks=1
